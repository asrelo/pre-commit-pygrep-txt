name: Release

permissions:
  contents: read

concurrency:
  group: "release-${{ inputs.version || github.ref_name }}"
  cancel-in-progress: false

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match pyproject.toml)"
        required: true
        type: string
      target:
        description: "Where to publish"
        required: true
        type: choice
        options: ["testpypi", "pypi"]
        default: "testpypi"

jobs:

  ci:
    uses: "./.github/workflows/ci-jobs.yml"

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check that version matches tag/input
        env:
          EXPECTED: ${{ inputs.version || github.ref_name }}
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$PKG_VERSION" != "$EXPECTED" ] && [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "Version mismatch: pyproject.toml has $PKG_VERSION, expected $EXPECTED"
            exit 1
          fi
      - uses: "./.github/actions/build"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: "dist/"

  publish:
    needs:
      - ci
      - build
    permissions:
      id-token: write
    environment:
      name: ${{ inputs.target || 'pypi' }}
    runs-on: ubuntu-latest
    # NOTE: `pypa/gh-action-pypi-publish` can be replaced
    #   with `pipx run twine upload dist/*`
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: "dist/"
      - name: Publish to TestPyPI
        if: "inputs.target == 'testpypi'"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: "inputs.target != 'testpypi'"
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: "startsWith(github.ref, 'refs/tags/')&& inputs.target != 'testpypi'"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: "dist/"
      - uses: softprops/action-gh-release@v3
        with:
          files: "dist/*"
          generate_release_notes: true
